<title id="t">mosim-reefscape-bot: a scripted bot that plays REEFSCAPE (FRC 2025) in MoSimulator as 1323 Madtown, with no RL and no demos. Mean score by version rises from 168.8 (v35) to 194.1 (v58, the default), below a dashed line at 200.</title>
